    <g stroke="url(#wire)" stroke-width="2.5" fill="none">
      <path d="M-132 96H-196"/>
      <path d="M-58 96C-96 96-96 96-132 96"/>
    </g>
    <g fill="#25D366">
      <circle cx="-46" cy="-24" r="6"/>
      <circle cx="0" cy="-4" r="6"/>
      <circle cx="-46" cy="20" r="6"/>
      <circle cx="44" cy="20" r="6"/>
    </g>
    <g stroke="#25D366" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M-46 -24 0 -4"/>
      <path d="M-46 -24 -46 20"/>
      <path d="M-46 20 44 20"/>
      <path d="M0 -4 44 20"/>
