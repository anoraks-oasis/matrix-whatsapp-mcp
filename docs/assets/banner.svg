<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="matrix-whatsapp-mcp — a Model Context Protocol server for WhatsApp over Matrix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1114"/>
      <stop offset="0.62" stop-color="#0B1114"/>
      <stop offset="1" stop-color="#0E1A18"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25D366" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#25D366" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#25D366" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16302B" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="64" y="62" width="222" height="30" rx="15" fill="none" stroke="#25D366" stroke-opacity="0.55"/>
    <text x="82" y="82" font-size="13" letter-spacing="1.6" fill="#25D366">MODEL CONTEXT PROTOCOL</text>

    <text x="62" y="176" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#E8F4F0">matrix-whatsapp-mcp</text>

    <text x="64" y="219" font-size="21" fill="#84A9A0">WhatsApp and Matrix, as tools an agent can actually use.</text>

    <g font-size="14" fill="#5F7C75">
      <text x="64" y="266">read rooms · page history · search · send with a fail-closed allowlist</text>
    </g>
  </g>

  <g transform="translate(1000 158)">
    <path d="M-58 -58h116a18 18 0 0 1 18 18v58a18 18 0 0 1-18 18H-8l-26 22 4-22h-28a18 18 0 0 1-18-18v-58a18 18 0 0 1 18-18z"
