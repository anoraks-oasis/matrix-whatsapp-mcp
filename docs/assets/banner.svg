    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#25D366">
      <text x="-196" y="104">&gt;</text>
      <rect x="-176" y="84" width="14" height="2" fill="#25D366"/>
